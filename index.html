<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 小手机</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#d6d6da;display:flex;align-items:center;justify-content:center;overflow:hidden}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
a{color:inherit;cursor:pointer}
#phone{--top:env(safe-area-inset-top,0px);--hb:26px;--fs:15px;--bg:#fff;--surf:#fafafa;--surf2:#efefef;--line:#dbdbdb;--ink:#262626;--sub:#8e8e8e;--accent:#0095f6;--like:#ed4956;--bub:#efefef;--bubink:#262626;--glass:rgba(255,255,255,.72);
  position:relative;width:100vw;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-size:var(--fs);flex:none}
#phone[data-theme=dark]{--bg:#000;--surf:#121212;--surf2:#262626;--line:#2c2c2c;--ink:#f5f5f5;--sub:#a8a8a8;--bub:#262626;--bubink:#f5f5f5;--glass:rgba(28,28,30,.66)}
@media(min-width:560px){#phone{--top:54px;width:440px;height:956px;border-radius:58px;box-shadow:0 0 0 11px #111,0 0 0 13px #3a3a3e,0 30px 80px rgba(0,0,0,.35)}}

/* 状态栏 / 灵动岛 / Home 条 */
#sb{position:absolute;top:0;left:0;right:0;height:var(--top);z-index:70;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0;font-weight:600;font-size:15px;color:var(--ink)}
#sb.t-light{color:#fff}
#sb .sbr{display:flex;gap:6px;align-items:center;font-size:12px}
.batt{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;display:inline-block;opacity:.9}
.batt::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:2px}
@media(max-width:559px){#sb{display:none}}
@media(min-width:560px){#sb::before{content:"";position:absolute;left:50%;top:12px;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px}}
#hbar{position:absolute;left:0;right:0;bottom:0;height:var(--hb);z-index:80;display:flex;justify-content:center;align-items:center;cursor:pointer}
#hbar::after{content:"";width:136px;height:5px;border-radius:3px;background:var(--hbc,#262626);opacity:.85}

/* 主屏 */
#home{position:absolute;inset:0;padding:calc(var(--top) + 16px) 18px 0;display:flex;flex-direction:column}
#home.t-light{--ht:#fff;--hs:rgba(0,0,0,.35)}
#home.t-dark{--ht:#1c1c1e;--hs:transparent}
.wid{display:flex;gap:12px;height:194px;margin-bottom:28px;flex:none}
.wph{flex:1;border-radius:28px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;cursor:pointer}
.wph img{width:100%;height:100%;object-fit:cover}
.wcol{flex:1;display:flex;flex-direction:column;gap:12px}
.wcard{flex:1;border-radius:28px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:12px 18px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.wcard b{font-size:34px;font-weight:300;letter-spacing:1px;line-height:1.1}
.wcard span{font-size:12px;color:var(--sub);margin-top:2px}
.wcard.note{font-size:14px;line-height:1.5;cursor:pointer;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.ic{position:relative;width:64px;height:64px;border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;font-size:31px}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
#phone[data-shape=circle] .ic{border-radius:50%}
#phone[data-shape=flat] .ic{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:44px}
.lb{font-size:11.5px;color:var(--ht);text-shadow:0 1px 3px var(--hs)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--like);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
.dock{position:absolute;left:14px;right:14px;bottom:calc(var(--hb) + 12px);height:92px;border-radius:36px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;justify-content:space-around;align-items:center}
.dock .lb{display:none}
.dock .ic{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px rgba(128,128,128,.18) inset}

/* 应用容器 */
#app{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;padding-bottom:var(--hb)}
#app[hidden]{display:none}
#app.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.bar{flex:none;padding-top:var(--top);min-height:calc(var(--top) + 50px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:6px;padding-right:6px;background:var(--bg);border-bottom:.5px solid var(--line)}
.bar h1{font-size:17px;font-weight:650;text-align:center}
.bar .l,.bar .r{display:flex;align-items:center}
.bar .r{justify-content:flex-end}
.bar button,.hb{background:none;border:0;font-size:21px;padding:6px 9px;cursor:pointer;color:var(--ink)}
.bar button[data-act=back],.hb[data-act=back]{font-size:32px;line-height:1;padding-bottom:10px}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.pad{padding:12px 16px}
.empty{text-align:center;color:var(--sub);padding:70px 36px;font-size:14px;line-height:1.8}
.hint{padding:12px 18px;font-size:12.5px;color:var(--sub);line-height:1.6}
.sec{padding:16px 18px 6px;font-size:13px;font-weight:600}
.item{display:flex;gap:13px;padding:11px 18px;align-items:center;cursor:pointer}
.item:active{background:var(--surf)}
.grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.t2{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:400}
.time{font-size:11.5px;color:var(--sub);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.ico{font-size:21px;width:28px;text-align:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:34px;height:34px;font-size:19px}
.av.md{width:60px;height:60px;font-size:30px}
.av.xl{width:100px;height:100px;font-size:50px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn.danger{background:#fde8ea;color:var(--like)}
.btn.big{width:100%;padding:13px;font-size:15px;margin-top:14px}
.seg{display:flex;background:var(--surf2);border-radius:10px;padding:3px;gap:2px}
.seg span{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);white-space:nowrap}
.seg span.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tg{width:44px;height:26px;border-radius:13px;background:var(--surf2);position:relative;flex:none;transition:.2s;border:.5px solid var(--line)}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--accent);border-color:var(--accent)}
.tg.on::after{left:20px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:8px;background:var(--surf2);color:var(--sub);margin-right:5px}
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:6px 14px;border-radius:16px;background:var(--surf2);font-size:13px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
input.line,.pad input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);outline:none;margin-top:6px}

/* 聊天 */
#chead{flex:none;padding-top:var(--top);min-height:calc(var(--top) + 54px);display:flex;align-items:center;gap:8px;padding-left:2px;padding-right:6px;border-bottom:.5px solid var(--line);background:var(--bg)}
#chead .hn{flex:1;min-width:0;line-height:1.25}
#chead .hn b{font-size:15.5px;display:block}
#chead .hn small{color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{border:1px solid var(--line);background:none;border-radius:14px;padding:4px 12px;font-size:12px;color:var(--sub);cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#msgs{padding:8px 0 10px;background-size:cover;background-position:center}
.m{display:flex;gap:8px;padding:4px 14px;align-items:flex-end}
.m.me{flex-direction:row-reverse}
.mc{max-width:72%}
.m.me .mc{text-align:right}
.bub{display:inline-block;padding:9px 14px;border-radius:20px;background:var(--bub);color:var(--bubink);line-height:1.5;font-size:var(--fs);white-space:pre-wrap;word-break:break-word;text-align:left}
.m.me .bub{background:var(--accent);color:#fff}
#phone[data-bubble=square] .bub{border-radius:7px}
#phone[data-bubble=grad] .m.me .bub{background:linear-gradient(135deg,#7a3cff,#d300c5 55%,#ff0069)}
.who{font-size:11px;color:var(--sub);margin:0 0 2px 4px;text-align:left}
.sysmsg{text-align:center;font-size:12px;color:var(--sub);padding:8px 28px;line-height:1.5}
.voice{display:inline-flex;align-items:center;gap:8px;min-width:96px;cursor:pointer}
.voice .wave{flex:1;height:14px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px);opacity:.55;-webkit-mask:linear-gradient(90deg,#000 0 100%);border-radius:2px}
.voice b{font-weight:500;font-size:12px}
.vtext{font-size:12.5px;color:var(--sub);margin-top:4px;text-align:left;max-width:100%}
.stk{font-size:56px;line-height:1.1}
.money{display:block;width:216px;border-radius:16px;background:linear-gradient(135deg,#ff8a5c,#ff3d6b);color:#fff;padding:12px 14px;cursor:pointer;text-align:left}
.money.tr{background:linear-gradient(135deg,#f7bd45,#f07f26)}
.money .amt{font-size:23px;font-weight:700;margin:2px 0}
.money .nt{font-size:13px;opacity:.95}
.money small{display:block;opacity:.85;font-size:11.5px;margin-top:9px;border-top:1px solid rgba(255,255,255,.35);padding-top:6px}
.money.done{filter:saturate(.3);opacity:.8}
.card2{display:inline-block;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surf);max-width:230px;font-size:13.5px;line-height:1.5}
.card2 b{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-bottom:4px}
.narr{margin:10px 22px;padding:2px 0 2px 14px;border-left:2px solid var(--accent);font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;line-height:1.9;white-space:pre-wrap;font-size:calc(var(--fs) + .5px)}
.youline{margin:10px 22px 10px 70px;text-align:right;color:var(--sub);font-style:italic;line-height:1.7;white-space:pre-wrap}
#notice{text-align:center;font-size:12.5px;color:var(--sub);padding:6px 10px;flex:none}
#notice:empty{display:none}
#notice a{color:var(--accent);font-weight:600}
.composer{display:flex;gap:6px;padding:8px 10px;border-top:.5px solid var(--line);align-items:flex-end;flex:none;background:var(--bg)}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 15px;resize:none;max-height:100px;background:var(--surf);outline:none;line-height:1.4}
.composer textarea.vm{border-color:var(--accent)}
.cb{width:38px;height:38px;border-radius:50%;border:0;background:none;font-size:21px;cursor:pointer;flex:none}
.cb.send{background:var(--accent);color:#fff;font-size:19px;font-weight:700}
#panel{flex:none;border-top:.5px solid var(--line);background:var(--surf);padding:12px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.pi{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--sub)}
.pi i{font-style:normal;font-size:24px;width:54px;height:54px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:.5px solid var(--line)}
.pi.on i{border-color:var(--accent);background:var(--surf2)}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:27px;text-align:center}
.emos span{cursor:pointer;padding:3px}

/* 圈子 */
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;border-bottom:.5px solid var(--line)}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex:none;width:68px;position:relative}
.story small{font-size:11.5px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:var(--line);position:relative}
.ring.on{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.ring .av{border:3px solid var(--bg)}
.ring.me i{position:absolute;right:0;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.ig{padding-bottom:12px}
.igh{display:flex;align-items:center;gap:10px;padding:10px 14px}
.igh b{font-size:14px}
.igh span{color:var(--sub);font-size:12px;flex:1}
.igh a{font-size:12px;color:var(--sub)}
.pimg{width:100%;display:block;max-height:520px;object-fit:cover}
.pph{aspect-ratio:1;background:linear-gradient(135deg,hsl(var(--h) 75% 84%),hsl(calc(var(--h) + 45) 70% 74%));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center;color:rgba(0,0,0,.6);gap:10px}
.pph span{font-size:34px}
.pph p{font-size:14px;line-height:1.6}
.iga{display:flex;gap:16px;padding:10px 14px 4px;font-size:23px}
.igl{padding:2px 14px;font-size:13.5px;font-weight:600}
.igc{padding:2px 14px;font-size:14px;line-height:1.55;word-break:break-word}
.igc b{margin-right:4px}

/* 论坛 / 档案 / 其他 */
.fp{padding:14px 18px;border-bottom:.5px solid var(--line);cursor:pointer}
.ft{font-weight:650;font-size:15.5px;line-height:1.4}
.fc{font-size:13.5px;color:var(--sub);margin-top:5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:9px}
.detail{padding:16px 18px;border-bottom:.5px solid var(--line)}
.detail h2{font-size:19px;line-height:1.4;margin-bottom:10px}
.who2{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--sub)}
.who2 b{display:block;font-size:14px;color:var(--ink)}
.rp{display:flex;gap:10px;padding:12px 18px;border-bottom:.5px solid var(--line)}
.rp .fl{font-size:11px;color:var(--sub);margin-top:4px}
.tx{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.prof{text-align:center;padding:22px 18px 8px}
.prof h2{margin-top:10px;font-size:20px}
.prof .sig{color:var(--sub);font-size:13.5px;margin-top:4px;line-height:1.5}
.aff{margin:12px 0;font-size:13px;color:var(--sub)}
.aff b{color:var(--like);letter-spacing:2px;font-size:16px}
.btnrow{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
.kv{padding:6px 18px 20px}
.kv div{padding:10px 0;border-bottom:.5px solid var(--line);font-size:14px;line-height:1.55;white-space:pre-wrap}
.kv small{display:block;color:var(--sub);font-size:11.5px;margin-bottom:2px}
.balance{margin:16px;padding:22px;border-radius:22px;background:linear-gradient(135deg,#262626,#555);color:#fff}
.balance small{opacity:.7;font-size:12px}
.balance b{display:block;font-size:36px;font-weight:600;margin:4px 0 14px}
.balance .btnrow{justify-content:flex-start;margin:0}
.shop{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:.5px solid var(--line);cursor:pointer}
.shop .se{width:56px;height:56px;border-radius:16px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:30px}
.price{color:var(--like);font-weight:600}
.plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:20px;line-height:1;cursor:pointer}
.cartbar{flex:none;margin:8px 14px;padding:12px 16px;border-radius:18px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between}
.cartbar button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:600;cursor:pointer}
.out{margin:6px 16px 14px;padding:16px;border-radius:18px;background:var(--surf);border:.5px solid var(--line)}
.out h4{font-size:15px;margin-bottom:4px}
.out small{color:var(--sub);font-size:12px}
.out p{margin-top:10px;font-family:"Songti SC","Noto Serif SC",serif;line-height:1.85;font-size:14.5px;white-space:pre-wrap}
.pcard{margin:8px 16px;padding:14px 16px;border-radius:16px;background:var(--surf);border:.5px solid var(--line);line-height:1.7;font-size:14px;white-space:pre-wrap}
.pcard b{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.wp{width:48px;height:84px;border-radius:10px;cursor:pointer;flex:none;border:1px solid var(--line);background-size:cover;background-position:center}
.rowx{display:flex;gap:10px;align-items:center;padding:6px 18px;overflow-x:auto}
.rowx .btn{flex:none}

/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:90}
.sheet{width:100%;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--hb));max-height:88%;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:12px;text-align:center}
.sheet p.desc{font-size:13.5px;color:var(--sub);line-height:1.6;text-align:center}
.fld{display:block;margin-bottom:12px}
.fl{display:block;font-size:12px;color:var(--sub)}
.sheet input:not([type=checkbox]):not([type=file]),.sheet textarea,.sheet select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);outline:none}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus,.pad input:focus{border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:12px}
.imgrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{border-radius:12px;padding:13px;text-align:center}
#toast{position:absolute;left:50%;bottom:calc(var(--hb) + 104px);transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;max-width:84%;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#banner{position:absolute;left:10px;right:10px;top:calc(var(--top) + 4px);z-index:95;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(-160%);transition:transform .35s cubic-bezier(.2,.9,.3,1);cursor:pointer}
#banner.on{transform:none}
#banner b{font-size:14px;display:block}

function pickImage({size=512,square=false,w,h,q=.8,type='image/jpeg'}={}){
  return new Promise(res=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=()=>{
      const f=inp.files[0];if(!f)return res(null);
      const rd=new FileReader();
      rd.onload=()=>{const im=new Image();
        im.onload=()=>{
          let cw,ch;
          if(square){cw=ch=size}else if(w&&h){cw=w;ch=h}else{const k=Math.min(1,size/Math.max(im.width,im.height));cw=Math.round(im.width*k);ch=Math.round(im.height*k)}
          const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d');
          const sc=Math.max(cw/im.width,ch/im.height),dw=im.width*sc,dh=im.height*sc;
          cx.drawImage(im,(cw-dw)/2,(ch-dh)/2,dw,dh);res(cv.toDataURL(type,q));
        };
        im.onerror=()=>res(null);im.src=rd.result};
      rd.readAsDataURL(f);
    };
    inp.click();
  });
}

const apiURL=()=>S.settings.baseUrl.replace(/\/+$/,'')+'/chat/completions';
const apiHead=()=>({'Content-Type':'application/json','Authorization':'Bearer '+S.settings.apiKey});
async function callAPI(messages,temperature){
  if(!S.settings.apiKey)throw new Error('NOKEY');
  const r=await fetch(apiURL(),{method:'POST',headers:apiHead(),body:JSON.stringify({model:S.settings.model,messages,temperature:temperature??Number(S.settings.temperature)})});
  if(!r.ok)throw new Error('API '+r.status+':'+(await r.text()).slice(0,160));
  const j=await r.json();return (j.choices?.[0]?.message?.content||'').trim();
}
/* 流式输出(SSE);服务端不支持时自动按普通 JSON 解析 */
async function callStream(messages,onText){
  if(!S.settings.apiKey)throw new Error('NOKEY');
  const r=await fetch(apiURL(),{method:'POST',headers:apiHead(),body:JSON.stringify({model:S.settings.model,messages,temperature:Number(S.settings.temperature),stream:true})});
  if(!r.ok)throw new Error('API '+r.status+':'+(await r.text()).slice(0,160));
  if(!r.body||!r.body.getReader){const j=await r.json();const t=(j.choices?.[0]?.message?.content||'').trim();onText(t);return t}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='',raw='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    const chunk=dec.decode(value,{stream:true});raw+=chunk;buf+=chunk;
    const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){
      const s=ln.trim();if(!s.startsWith('data:'))continue;
      const d=s.slice(5).trim();if(d==='[DONE]')continue;
      try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t){full+=t;onText(full)}}catch(e){}
    }
  }
  if(!full){try{full=(JSON.parse(raw).choices?.[0]?.message?.content||'').trim();onText(full)}catch(e){}}
  return full.trim();
}
const errText=e=>e.message==='Failed to fetch'?'请求失败:请检查接口地址,或该服务是否允许浏览器直接调用(CORS)':e.message;
async function askJSON(prompt,fallback,quiet){

}

function speak(text,c){

  const u=new SpeechSynthesisUtterance(String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
  u.lang='zh-CN';const v=c?.voice||{};
  if(v.name){const f=speechSynthesis.getVoices().find(x=>x.name===v.name);if(f)u.voice=f}
  u.rate=clamp(+v.rate||1,.5,2);u.pitch=clamp(+v.pitch||1,0,2);speechSynthesis.speak(u);
}
function dictate(cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function fieldsHTML(fields){

    if(f.type==='select')return `<label class="fld">${L}<select id="${id}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    if(f.type==='check')return `<label class="chk"><input type="checkbox" id="${id}" ${f.val?'checked':''}> ${f.label}</label>`;
    if(f.type==='img')return `<div class="fld" id="${id}">${L}<div class="imgrow"><div class="av ip">${f.val?`<img src="${f.val}">`:esc(f.ph||'＋')}</div><button type="button" class="btn ghost" data-pick>选择图片</button><button type="button" class="btn ghost" data-clr>清除</button></div></div>`;

- 完全以角色身份,像真人发微信一样简短自然,不要旁白,不要说自己是AI;每次发 1-4 条消息,用 ||| 分隔。

const msgText=m=>({voice:'[语音]'+m.content,red:`[红包:${m.amt}:${m.note||''}]`,transfer:`[转账:${m.amt}:${m.note||''}]`,sticker:`[表情:${m.content}]`,img:`[图片:${m.content}]`,food:`[外卖:${m.content}]`}[m.type]||m.content);
function toAPI(log){
  const out=[];
  log.slice(-S.settings.history).forEach(m=>{
    if(m.role==='sys'){if(m.ai)out.push({role:'user',content:'【系统事件】'+m.content});return}
    if(m.fail)return;
    out.push({role:m.role==='user'?'user':'assistant',content:msgText(m)});
  });
  const merged=[];
  out.forEach(x=>{const l=merged[merged.length-1];if(l&&l.role===x.role)l.content+=(x.role==='assistant'?' ||| ':'\n')+x.content;else merged.push({...x})});
  if(merged[0]?.role==='assistant')merged.unshift({role:'user',content:'(开始聊天)'});
  return merged;
}
function parseReply(text,off){
  let aff=0,block=false;
  text=text.replace(/\[好感\s*([+\-＋－])\s*(\d+)\]/g,(_,s,n)=>{aff+=(/[-－]/.test(s)?-1:1)*Math.min(+n,5);return ''}).replace(/\[拉黑\]/g,()=>{block=true;return ''}).trim();
  if(off)return{parts:text?[{type:'narr',content:text}]:[],aff,block};
  const parts=[];
  text.split('|||').map(s=>s.trim()).filter(Boolean).forEach(s=>{
    let m;
    if(m=s.match(/^\[语音\]\s*([\s\S]+)$/))parts.push({type:'voice',content:m[1].trim()});
    else if(m=s.match(/^\[(红包|转账)[:：]\s*([\d.]+)\s*(?:[:：]\s*([\s\S]*?))?\]$/))parts.push({type:m[1]==='红包'?'red':'transfer',amt:clamp(parseFloat(m[2])||0,0.01,888),note:(m[3]||'').trim(),state:'unclaimed'});
    else if(m=s.match(/^\[表情[:：]\s*([\s\S]+?)\]$/))parts.push({type:'sticker',content:m[1].trim()});
    else if(m=s.match(/^\[图片[:：]\s*([\s\S]+?)\]$/))parts.push({type:'img',content:m[1].trim()});
    else if(m=s.match(/^\[外卖[:：]\s*([\s\S]+?)\]$/))parts.push({type:'food',content:m[1].trim()});
    else parts.push({type:'text',content:s});
  });
  return{parts,aff,block};
}
function applyReply(cid,text,off){
  const c=charById(cid),log=chatLog(cid),{parts,aff,block}=parseReply(text,off);
  parts.forEach((p,i)=>log.push({id:uid(),role:'assistant',from:cid,time:now()+i,...p}));
  if(aff)c.aff=clamp((c.aff??50)+aff,0,100);
  if(block){c.blockedMe=true;log.push({id:uid(),role:'sys',type:'sys',content:`${c.name} 已将你拉黑`,time:now()})}
  const last=parts.slice().reverse().find(p=>p.type==='voice');
  if(last&&S.settings.autoVoice)speak(last.content,c);
}
const liveText=t=>t.replace(/\[(好感|拉黑)[^\]]*\]/g,'').replace(/\[[^\]]*$/,'').replace(/\|\|\|/g,'\n').trim();
function notify(cid){
  const viewing=ui.app==='chat'&&ui.sub?.type==='chat'&&ui.sub.id===cid;
  if(viewing)return;
  M(cid).unread=(M(cid).unread||0)+1;
  banner(chatTitle(cid),msgPreview(lastMsg(cid)),()=>acts.chat({id:cid}));
}
/* 核心:让角色基于当前聊天记录回复(用户消息、事件、重新生成都走这里) */
async function aiReply(cid){
  const c=charById(cid),meta=M(cid),log=chatLog(cid);
  if(meta.blocked||chatBusy[cid])return;
  const off=meta.mode==='offline';
  chatBusy[cid]=true;ui.live={cid,text:''};refresh();
  let text='',err=null;
  try{
    const ctx=log.slice(-S.settings.history).map(m=>m.content||'').join('\n');
    const msgs=[{role:'system',content:buildSystem(c,off,ctx)},...toAPI(log)];
    text=S.settings.stream?await callStream(msgs,t=>{if(ui.live){ui.live.text=t;renderLive()}}):await callAPI(msgs);
  }catch(e){err=e}
  ui.live=null;chatBusy[cid]=false;
  if(err){
    if(err.message==='NOKEY'){
      text=off?'(演示模式)你们安静地对视了一会儿。到「设置 → API 设置」填写接口后,TA 才能真正回应你。':pick(DEMO_CHAT);
      if(!log.some(m=>m.role==='sys'&&m.content.startsWith('未配置')))log.push({id:uid(),role:'sys',type:'sys',content:NOKEY_HINT,time:now()});
    }else{log.push({id:uid(),role:'sys',type:'sys',content:'出错了:'+errText(err),time:now()});save();refresh();return}
  }
  applyReply(cid,text,off);notify(cid);save();refresh();
}
async function sendChat(cid,text,type='text',extra={}){
  const c=charById(cid),m=M(cid);
  if(m.blocked)return toast('你已拉黑TA,先解除拉黑');
  const log=chatLog(cid);
  log.push({id:uid(),role:'user',type,content:text,off:m.mode==='offline',time:now(),fail:!!c.blockedMe,...extra});
  if(c.blockedMe){
    if(!log.slice(-3).some(x=>x.role==='sys'&&x.content.startsWith('消息已发出')))log.push({id:uid(),role:'sys',type:'sys',content:'消息已发出,但被对方拒收了',time:now()});
    save();refresh();return;
  }
  save();refresh();await aiReply(cid);
}
function chatEvent(cid,text,{react=true,hidden=false}={}){
  chatLog(cid).push({id:uid(),role:'sys',type:'sys',ai:true,hidden,content:text,time:now()});save();refresh();
  if(react&&S.settings.apiKey)aiReply(cid);
}
async function sendGroup(gid,text){
  const g=groupById(gid),log=chatLog(gid);
  log.push({id:uid(),role:'user',type:'text',content:text,time:now()});save();refresh();
  chatBusy[gid]=true;ui.live={cid:gid,text:''};refresh();
  const members=g.members.map(charById);
  const transcript=log.filter(m=>m.role!=='sys').slice(-S.settings.history).map(m=>(m.role==='user'?S.me.name:charById(m.from).name)+':'+m.content).join('\n');
  const data=await askJSON(`这是一个微信群「${g.name}」,成员:\n${members.map(c=>`id=${c.id} 名字=${c.name} 设定=${c.persona||''} ${c.speech||''}`).join('\n')}\n用户「${S.me.name}」的设定:${S.me.persona||'无'}\n${worldFor('',transcript)}\n最近聊天记录:\n${transcript}\n请让2-4位合适的成员依次回复用户的最新消息,符合各自性格,口语化、简短,成员之间可以互相接话。\n输出JSON数组:[{"id":"成员id","text":"内容"}]`,
    ()=>members.slice(0,2).map(c=>({id:c.id,text:pick(DEMO_CHAT)})),true);
  ui.live=null;chatBusy[gid]=false;
  if(Array.isArray(data)){
    data.forEach(d=>{if(g.members.includes(d.id)&&d.text)log.push({id:uid(),role:'assistant',type:'text',from:d.id,content:String(d.text),time:now()})});
    if(!S.settings.apiKey&&!log.some(m=>m.role==='sys'&&m.content.startsWith('未配置')))log.push({id:uid(),role:'sys',type:'sys',content:NOKEY_HINT,time:now()});
    notify(gid);
  }
  save();refresh();
}

function pay(amt,desc){if(S.wallet.balance+1e-9<amt){toast('余额不足,去「钱包」签到或充值');return false}S.wallet.balance=+(S.wallet.balance-amt).toFixed(2);S.wallet.records.unshift({id:uid(),time:now(),desc,amt:-amt});return true}
function income(amt,desc){S.wallet.balance=+(S.wallet.balance+amt).toFixed(2);S.wallet.records.unshift({id:uid(),time:now(),desc,amt})}
function moneyForm(kind,cid){
  const name=kind==='red'?'红包':'转账';
  form('发'+name,[{k:'amt',label:`金额(元) · 余额 ${money(S.wallet.balance)}`,type:'number',step:'0.01',val:kind==='red'?'8.88':'52.00'},{k:'note',label:'留言',val:kind==='red'?'恭喜发财,大吉大利':'请你喝奶茶'}],o=>{

    save();sendChat(cid,'',kind==='red'?'red':'transfer',{amt,note:o.note.trim(),state:'sent'});
  },[],'塞钱进去');
}

  o.status='done';save();
  const names=o.items.map(i=>i.n+(i.q>1?'×'+i.q:'')).join('、');

function msgHTML(m,id,g){
  if(m.role==='sys')return `<div class="sysmsg">${esc(m.content)}</div>`;
  const me=m.role==='user',a=me?S.me:charById(m.from||id),off=!g&&(m.type==='narr'||m.off);
  if(m.type==='narr')return `<div class="narr" data-mid="${m.id}">${esc(m.content)}</div>`;
  if(me&&m.off&&(m.type==='text'||!m.type))return `<div class="youline" data-mid="${m.id}">${esc(m.content)}</div>`;
  const avh=me||g?av(a,'sm'):`<div data-act="poke" data-id="${id}">${av(a,'sm')}</div>`;
  const who=g&&!me?`<div class="who">${esc(a.name)}</div>`:'';
  let body;
  switch(m.type){
    case 'voice':{const s=Math.max(1,Math.ceil(m.content.length/4));body=`<div class="bub voice" data-act="voice" data-mid="${m.id}" style="min-width:${Math.min(60+s*10,220)}px"><span>▶</span><span class="wave"></span><b>${s}″</b></div>${m.show?`<div class="vtext">${esc(m.content)}</div>`:''}`;break}
    case 'red':case 'transfer':{
      const red=m.type==='red',claimable=!me&&m.state!=='claimed',done=m.state==='claimed';
      body=`<div class="money ${red?'':'tr'} ${done?'done':''}" ${claimable?`data-act="claim" data-mid="${m.id}"`:''}><div class="nt">${red?'🧧':'💸'} ${esc(m.note||(red?'恭喜发财':'转账'))}</div><div class="amt">${money(m.amt)}</div><small>${red?'红包':'转账'} · ${me?'已发送':done?'已领取':'点击领取'}</small></div>`;break}
    case 'sticker':body=`<div class="stk">${esc(m.content)}</div>`;break;
    case 'img':body=`<div class="card2"><b>📷 图片</b>${esc(m.content)}</div>`;break;
    case 'food':body=`<div class="card2"><b>🍜 ${me?'你给TA点了外卖':'TA 给你点了外卖'}</b>${esc(m.content)}${m.note?`<br><span style="color:var(--sub)">备注:${esc(m.note)}</span>`:''}</div>`;break;
    default:body=`<div class="bub">${esc(m.content)}</div>`;
  }
  return `<div class="m ${me?'me':''}" >${avh}<div class="mc" data-mid="${m.id}">${who}${body}${m.fail?'<div class="who" style="color:var(--like);text-align:right">❗ 发送失败,对方已将你拉黑</div>':''}</div></div>`;
}
function renderMsgs(){
  const box=$('#msgs');if(!box||ui.sub?.type!=='chat')return;

  chatLog(id).forEach(m=>{
    if(m.hidden)return;
    if(m.time-prev>6e5)h+=`<div class="sysmsg">${fmt(m.time)}</div>`;
    prev=m.time;h+=msgHTML(m,id,g);
  });
  if(ui.live?.cid===id)h+=off?`<div class="narr" id="live">…</div>`:`<div class="m">${av(g?{avatar:'💬'}:charById(id),'sm')}<div class="mc"><div class="bub" id="live">…</div></div></div>`;
  box.innerHTML=h;box.scrollTop=box.scrollHeight;
}

function renderApp(opts={}){
  const a=$('#app');
  if(!ui.app){a.hidden=true;renderHome();applyStyle();return}
  a.hidden=false;
  const key=ui.app+(ui.sub?':'+ui.sub.type:'');
  a.innerHTML=(views[key]||views[ui.app])();
  if(opts.pop){a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop')}
  hooks[key]&&hooks[key]();applyStyle();
}
function refresh(){
  if(!ui.app){renderHome();return}
  if(ui.app==='chat'&&ui.sub?.type==='chat'){renderMsgs();renderChatBar();return}
  if(ui.app==='forum'&&ui.sub?.type==='post'){renderPost();return}
  renderApp();
}

function msgMenu(mid){
  const id=ui.sub?.id;if(!id)return;
  const log=chatLog(id),m=log.find(x=>x.id===mid);if(!m)return;
  ui.selMsg=mid;
  const lastAi=m.role==='assistant'&&log.slice().reverse().find(x=>x.role!=='sys')?.id===mid||(m.role==='assistant'&&log[log.length-1]?.role==='assistant');
  sheet(`<h3>消息</h3><div class="menu">${['text','voice','narr',undefined].includes(m.type)?'<button class="btn ghost" data-act="msgcopy">复制</button>':''}${m.role==='assistant'&&['text','voice','narr'].includes(m.type)?'<button class="btn ghost" data-act="msgspeak">朗读</button>':''}${lastAi&&!isGroup(id)?'<button class="btn ghost" data-act="regen">重新生成回复</button>':''}<button class="btn danger" data-act="msgdel">删除</button></div>`);
}
const selMsg=()=>chatLog(ui.sub.id).find(x=>x.id===ui.selMsg);
const acts={
  open(d){ui.app=d.id;ui.sub=null;ui.ret=null;ui.panel=null;renderApp({pop:true})},
  back(){
    if(ui.ret&&ui.sub?.type==='char'){const r=ui.ret;ui.ret=null;ui.app=r.app;ui.sub=r.sub;renderApp();return}
    if(ui.sub){ui.sub=null;ui.panel=null}else ui.app=null;renderApp();
  },
  home(){if(!ui.app)return;ui.app=null;ui.sub=null;ui.panel=null;renderApp()},
  /* 聊天 */
  chat(d){
    ui.app='chat';ui.sub={type:'chat',id:d.id};ui.panel=null;ui.ret=null;
    const log=chatLog(d.id);M(d.id).unread=0;
    if(!log.length&&!isGroup(d.id)){const c=charById(d.id);if(c.greeting)log.push({id:uid(),role:'assistant',type:'text',from:d.id,content:c.greeting,time:now()})}
    save();renderApp({pop:true});
  },
  mode(){const m=M(ui.sub.id);m.mode=m.mode==='offline'?'online':'offline';chatLog(ui.sub.id).push({id:uid(),role:'sys',type:'sys',ai:true,content:m.mode==='offline'?'你们现在线下见面了,处在同一个场景里。':'你们回到了手机线上聊天。',time:now()});save();ui.panel=null;renderPanel();refresh()},
  plus(){ui.panel=ui.panel?null:'plus';renderPanel()},
  pl(d){
    const id=ui.sub.id;
    if(d.id==='red'||d.id==='transfer'){ui.panel=null;renderPanel();return moneyForm(d.id,id)}
    if(d.id==='voice'){ui.voiceMode=!ui.voiceMode;ui.panel=null;renderPanel();renderChatBar();toast(ui.voiceMode?'语音模式已开:发送的文字会变成语音消息':'语音模式已关');return}
    if(d.id==='poke'){ui.panel=null;renderPanel();return acts.poke({id})}
    if(d.id==='emoji'){ui.panel='emoji';renderPanel();return}
    if(d.id==='food'){ui.foodTo=id;ui.foodTab='shop';return acts.open({id:'food'})}
    if(d.id==='outing'){ui.outCid=id;return acts.open({id:'out'})}
  },
  emo(d){const id=ui.sub.id;ui.panel=null;renderPanel();if(chatBusy[id])return;isGroup(id)?sendGroup(id,d.id):sendChat(id,d.id,'sticker')},
  poke(d){
    const c=charById(d.id);if(isGroup(d.id)||M(d.id).blocked||c.blockedMe)return;
    if(chatBusy[d.id])return;
    chatEvent(d.id,`${S.me.name} 拍了拍你`);
    if(!S.settings.apiKey)toast('拍了拍 TA(配置 API 后 TA 会有反应)');
  },
  voice(d,t){
    const m=selMsg0(t.dataset.mid);if(!m)return;
    m.show=!m.show;save();renderMsgs();
    speak(m.content,m.role==='user'?null:charById(m.from||ui.sub.id));
  },
  claim(d,t){
    const m=selMsg0(t.dataset.mid);if(!m||m.state==='claimed')return;
    m.state='claimed';income(m.amt,`${charById(m.from||ui.sub.id).name}的${m.type==='red'?'红包':'转账'}`);save();renderMsgs();toast(`已领取 ${money(m.amt)}`);
    chatEvent(ui.sub.id,`${S.me.name}领取了你发的${m.type==='red'?'红包':'转账'}(${money(m.amt)})`);
  },
  msgcopy(){const m=selMsg();if(m)navigator.clipboard?.writeText(m.content).then(()=>toast('已复制'),()=>toast('复制失败'))},
  msgspeak(){const m=selMsg();if(m)speak(m.content,charById(m.from||ui.sub.id))},
  msgdel(){const id=ui.sub.id;S.chats[id]=chatLog(id).filter(x=>x.id!==ui.selMsg);save();renderMsgs()},
  regen(){
    const id=ui.sub.id,log=chatLog(id);
    while(log.length&&log[log.length-1].role==='assistant')log.pop();
    save();renderMsgs();aiReply(id);
  },
  chatmenu(){
    const id=ui.sub.id,g=isGroup(id),c=g?null:charById(id),m=M(id);
    sheet(`<h3>${esc(chatTitle(id))}</h3><div class="menu">${g?'':'<button class="btn ghost" data-act="profile" data-id="'+id+'">查看档案</button>'}<button class="btn ghost" data-act="chatbg">设置本聊天壁纸</button>
    ${g?'<button class="btn danger" data-act="groupdel">解散群聊</button>':`<button class="btn ghost" data-act="${m.blocked?'unblock':'block'}">${m.blocked?'解除拉黑':'拉黑 TA'}</button>${c.blockedMe?'<button class="btn ghost" data-act="friendreq">发送好友申请</button>':''}`}
    <button class="btn danger" data-act="chatclear">清空聊天记录</button></div>`);
  },
  async chatbg(){const d=await pickImage({w:600,h:1304,q:.78});if(d){M(ui.sub.id).bg=d;save();applyBgs();toast('已更换壁纸')}},
  chatclear(){S.chats[ui.sub.id]=[];save();renderMsgs();toast('已清空')},
  async groupdel(){if(!await askConfirm('解散这个群聊?'))return;const id=ui.sub.id;S.groups=S.groups.filter(g=>g.id!==id);delete S.chats[id];ui.sub=null;save();renderApp()},
  block(){M(ui.sub.id).blocked=true;chatLog(ui.sub.id).push({id:uid(),role:'sys',type:'sys',content:'你已将 TA 拉黑',time:now()});save();refresh()},
  unblock(){M(ui.sub.id).blocked=false;chatLog(ui.sub.id).push({id:uid(),role:'sys',type:'sys',content:'你已解除拉黑',time:now()});save();refresh()},
  async friendreq(){
    const id=ui.sub?.id||ui.sub?.id,c=charById(id);if(!c.blockedMe)return;
    const t=await askText('好友申请 / 道歉','写下你想对 TA 说的话…');if(!t)return;
    chatLog(id).push({id:uid(),role:'user',type:'sys',content:'你发送了好友申请:'+t,time:now()});
    const d=await askJSON(`你是「${c.name}」。\n${charSheet(c)}\n你因为被用户「${S.me.name}」严重冒犯,把对方拉黑了。你对用户的好感度 ${c.aff??50}/100。\n对方现在发来好友申请:「${t}」。\n最近聊天:\n${chatLog(id).filter(m=>m.role!=='sys').slice(-8).map(m=>(m.role==='user'?S.me.name:c.name)+':'+msgText(m)).join('\n')}\n请决定是否原谅(好感度越高越容易原谅,诚意也很重要)。输出JSON:{"forgive":true或false,"text":"你的回应(若原谅则是通过后说的第一句话)"}`,
      ()=>({forgive:Math.random()<.6,text:'(演示)……下不为例。'}),true);
    if(!d)return;
    const log=chatLog(id);
    if(d.forgive){c.blockedMe=false;log.push({id:uid(),role:'sys',type:'sys',content:`${c.name} 通过了你的好友申请`,time:now()});log.push({id:uid(),role:'assistant',type:'text',from:id,content:String(d.text||'……好吧。'),time:now()})}
    else log.push({id:uid(),role:'sys',type:'sys',content:`${c.name} 没有通过你的好友申请`,time:now()});
    save();refresh();
  },
  /* 档案 / 通讯录 */
  profile(d){ui.ret=ui.app==='chat'&&ui.sub?.type==='chat'?{app:'chat',sub:ui.sub}:null;ui.app='contacts';ui.sub={type:'char',id:d.id};renderApp()},
  cadd(){sheet('<h3>添加</h3><div class="menu"><button class="btn ghost" data-act="cnew">✎ 新建档案</button><button class="btn ghost" data-act="cgen">✨ AI 生成角色</button><button class="btn ghost" data-act="cimport">📥 导入角色卡</button><button class="btn ghost" data-act="gnew">👥 创建群聊</button></div>')},
  cnew(){charForm()},
  cedit(d){charForm(S.chars.find(c=>c.id===d.id))},
  cexport(d){exportChar(S.chars.find(c=>c.id===d.id));toast('角色卡已导出')},
  cblock(d){const m=M(d.id);m.blocked=!m.blocked;save();refresh()},
  async cdel(d){
    if(!await askConfirm('删除这位好友及其聊天记录?'))return;
    S.chars=S.chars.filter(c=>c.id!==d.id);delete S.chats[d.id];delete S.meta[d.id];
    S.groups.forEach(g=>g.members=g.members.filter(i=>i!==d.id));ui.sub=null;ui.ret=null;save();renderApp();
  },
  async cgen(){
    const kw=await askText('想要什么样的角色?','例如:住在隔壁的神秘作家(可留空,随机生成)');if(kw===null)return;
    await withBusy('正在生成角色…',async()=>{
      const d=await askJSON(`请创作一个适合在手机里聊天的虚构角色。要求:${kw||'随机,有个性、有记忆点'}。\n已有好友:${S.chars.map(c=>c.name).join('、')||'无'}(不要重名)\n${worldFor('',kw)}\n输出JSON:{"name":"名字","avatar":"一个emoji","signature":"个性签名","gender":"","age":"","job":"","persona":"性格","looks":"外貌","speech":"说话风格/口癖","background":"背景故事,80字内","relation":"与用户的关系","callMe":"对用户的称呼","greeting":"第一次聊天的开场白"}`,
        ()=>({name:pick(['阿澈','苏晚','周小棠']),avatar:pick(['🦊','🌙','🍵']),persona:'(演示角色)性格随和,爱聊天。',greeting:'你好呀~'}));
      if(d?.name){const c={id:'c'+uid(),aff:50,voice:{},...d,avatar:String(d.avatar||'🙂')};S.chars.push(c);save();refresh();toast('新好友 '+c.name+' 已加入')}
    });
  },
  cimport(){
    sheet(`<h3>导入角色卡</h3><p class="desc">支持本应用导出的角色卡,以及常见的 JSON 角色卡(含 SillyTavern V1/V2,会一并导入内置世界书)。</p><div class="row" style="justify-content:center"><button class="btn ghost" data-x="file">选择 .json 文件</button></div><textarea id="im" rows="5" placeholder="或把角色卡 JSON 粘贴到这里" style="margin-top:12px"></textarea><div class="row"><button class="btn ghost" data-x="no">取消</button><button class="btn" data-x="ok">导入</button></div>`,(s,close)=>{
      const run=txt=>{try{const c=importCard(JSON.parse(txt));S.chars.push(c);save();close();refresh();toast('已导入:'+c.name)}catch(e){toast('无法识别这个角色卡')}};
      s.querySelector('[data-x=no]').onclick=close;
      s.querySelector('[data-x=ok]').onclick=()=>run($('#im',s).value);
      s.querySelector('[data-x=file]').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>run(r.result);r.readAsText(f)};i.click()};
    });
  },
  gnew(){
    if(S.chars.length<2)return toast('至少要有 2 位好友才能建群');
    form('创建群聊',[{k:'name',label:'群名',val:'快乐小群'},...S.chars.map(c=>({k:'m_'+c.id,label:c.name,type:'check',val:true}))],o=>{
      const members=S.chars.filter(c=>o['m_'+c.id]).map(c=>c.id);
      if(!o.name.trim()||members.length<2){toast('需要群名和至少 2 位成员');return false}
      S.groups.push({id:'g_'+uid(),name:o.name.trim(),members});save();refresh();
    });
  },
  /* 圈子 */
  mgen(){genMoments()},
  async mpost(){
    form('发动态',[{k:'text',label:'此刻的想法',type:'area',rows:3},{k:'img',type:'img',label:'配一张照片(可选)',val:'',ph:'＋',opt:{size:800,q:.78}}],o=>{
      if(!o.text.trim()&&!o.img){toast('写点什么或选张照片');return false}
      const p={id:uid(),authorId:'me',text:o.text.trim(),img:o.img,time:now(),likes:[],comments:[]};
      S.moments.push(p);save();refresh();reactMoment(p);
    },[],'发布');
  },
  like(d){const p=S.moments.find(x=>x.id===d.id),i=p.likes.indexOf('me');i<0?p.likes.push('me'):p.likes.splice(i,1);save();refresh()},
  async cmt(d){const p=S.moments.find(x=>x.id===d.id);const t=await askText('评论');if(!t)return;p.comments.push({authorId:'me',text:t,time:now()});save();refresh();replyComment(p,t)},
  mdel(d){S.moments=S.moments.filter(x=>x.id!==d.id);save();refresh()},
  story(d){
    const c=charById(d.id),p=S.moments.filter(x=>x.authorId===d.id).sort((a,b)=>b.time-a.time)[0];
    if(!p)return toast(c.name+' 还没有动态');
    sheet(`<h3>${esc(c.name)}</h3>${p.pic?`<div class="pph" style="--h:${hash(p.pic)%360};border-radius:16px;margin-bottom:12px"><span>📷</span><p>${esc(p.pic)}</p></div>`:''}<p class="desc" style="color:var(--ink);font-size:15px">${esc(p.text)}</p><div class="row" style="justify-content:center"><button class="btn" data-act="chat" data-id="${c.id}">发消息</button></div>`);
  },
  /* 论坛 */
  fboard(d){ui.board=d.id;renderApp()},
  async fnewboard(){const t=await askText('新板块名称');if(t&&!S.forum.boards.includes(t)){S.forum.boards.push(t);ui.board=t;save();renderApp()}},
  fgen(){genForum()},
  fpost(){
    form('发帖',[{k:'board',label:'板块',type:'select',val:S.forum.boards.includes(ui.board)?ui.board:S.forum.boards[0],opts:S.forum.boards.map(b=>[b,b])},{k:'title',label:'标题'},{k:'content',label:'正文',type:'area',rows:5}],o=>{
      if(!o.title.trim()){toast('标题不能为空');return false}
      const p={id:uid(),board:o.board,authorId:'me',title:o.title.trim(),content:o.content.trim(),time:now(),replies:[]};
      S.forum.posts.push(p);save();refresh();if(S.settings.apiKey)genReplies(p,true);
    },[],'发布');
  },
  fopen(d){ui.sub={type:'post',id:d.id};renderApp()},
  fsummon(){const p=S.forum.posts.find(x=>x.id===ui.sub.id);if(p)withBusy('网友赶来围观…',()=>genReplies(p))},
  /* 钱包 */
  sign(){
    if(S.wallet.lastSign===new Date().toDateString())return toast('今天已经签过啦');
    const n=Math.floor(20+Math.random()*69);S.wallet.lastSign=new Date().toDateString();income(n,'每日签到');save();refresh();toast(`签到成功,零花钱 +${n}`);
  },
  async topup(){const t=await askText('充值金额(虚拟零钱)','例如 200');const n=parseFloat(t);if(!(n>0))return;income(Math.min(n,99999),'充值');save();refresh()},
  /* 外卖 */
  ftab(d){ui.foodTab=d.id;renderApp()},
  shop(d){ui.sub={type:'shop',id:+d.id};renderApp()},
  addcart(d){
    const s=SHOPS[ui.sub.id],it=s.items[+d.id];
    if(!ui.cart||ui.cart.shop!==s.n)ui.cart={shop:s.n,items:[]};
    const f=ui.cart.items.find(x=>x.n===it[0]);f?f.q++:ui.cart.items.push({n:it[0],p:it[1],q:1});renderApp();
  },
  customitem(){
    form('自定义商品',[{k:'n',label:'商品名',ph:'例如:一份温柔的关东煮'},{k:'p',label:'价格(元)',type:'number',step:'0.1',val:'20'}],o=>{
      const p=parseFloat(o.p);if(!o.n.trim()||!(p>0)){toast('请填写商品名和价格');return false}
      const s=SHOPS[ui.sub.id];if(!ui.cart||ui.cart.shop!==s.n)ui.cart={shop:s.n,items:[]};
      ui.cart.items.push({n:o.n.trim(),p,q:1});renderApp();
    },[],'加入购物车');
  },
  checkout(){
    const c=ui.cart;if(!c||!c.items.length)return;
    const total=c.items.reduce((a,b)=>a+b.p*b.q,0);
    form(`结算 ${money(total)}`,[{k:'to',label:'送给谁',type:'select',val:ui.foodTo||'me',opts:[['me','自己'],...S.chars.map(x=>[x.id,x.name])]},{k:'note',label:'备注',ph:'少辣、多放葱…'}],o=>{
      if(!pay(total,'外卖 · '+c.shop))return false;
      const ord={id:uid(),shop:c.shop,items:c.items.map(x=>({...x})),total,to:o.to,note:o.note.trim(),time:now(),eta:now()+(10+Math.random()*10)*1000,status:'delivering'};
      S.orders.unshift(ord);schedule(ord);ui.cart=null;ui.foodTo=null;ui.sub=null;ui.foodTab='orders';save();renderApp();toast('下单成功,骑手正在路上 🛵');
    },[],'支付');
  },
  /* 外出 / 查手机 */
  outc(d){ui.outCid=d.id;renderApp()},
  outp(d){ui.outPlace=d.id;ui.outCustom='';renderApp()},
  outgo(){goOut()},
  outchat(d){const m=M(d.id);m.mode='offline';save();acts.chat(d)},
  peekc(d){ui.peekId=d.id;renderApp()},
  peekt(d){ui.peekTab=d.id;renderApp()},
  peekgen(){if(ui.peekId)peekGen(ui.peekId)},
  peekgo(d){ui.peekId=d.id;acts.open({id:'peek'})},
  /* 世界书 */
  wnew(){worldForm()},
  wedit(d){worldForm(S.world.find(w=>w.id===d.id))},
  wtoggle(d){const w=S.world.find(x=>x.id===d.id);w.enabled=!w.enabled;save();renderApp()},
  /* 美化 */
  dark(){S.style.dark=!S.style.dark;save();applyStyle();renderApp()},
  accent(d){S.style.accent=d.id;save();applyStyle();renderApp()},
  wall(d){S.style.wall=WALLS[+d.id];save();applyStyle()},
  async wallup(){const x=await pickImage({w:600,h:1304,q:.78});if(x){S.style.wall=x;save();applyStyle();renderApp()}},
  homet(d){S.style.homeText=d.id;save();applyStyle();renderApp()},
  cwall(d){S.style.chatBg=WALLS[+d.id];save();toast('聊天壁纸已更换')},
  async cwallup(){const x=await pickImage({w:600,h:1304,q:.78});if(x){S.style.chatBg=x;save();toast('聊天壁纸已更换')}},
  cwallclr(){S.style.chatBg='';save();toast('已恢复默认')},
  async widimg(){const x=await pickImage({square:true,size:480,q:.8});if(x){S.style.widgetImg=x;save();refresh()}},
  widclr(){S.style.widgetImg='';save();refresh()},
  async widnote(){const t=await askText('小组件便签','写点什么吧',S.style.widgetNote);if(t!==null){S.style.widgetNote=t;save();refresh()}},
  shape(d){S.style.shape=d.id;save();applyStyle();renderApp()},
  bubble(d){S.style.bubble=d.id;save();applyStyle();renderApp()},
  font(d){S.style.font=d.id;save();applyStyle();renderApp()},
  iconedit(d){
    const a=appInfo(d.id);
    form('自定义图标',[{k:'name',label:'名称',val:a.name},{k:'emoji',label:'emoji 图标',val:a.emoji},{k:'img',type:'img',label:'或上传图片图标',val:a.img||'',ph:'＋',opt:{square:true,size:128,q:.9,type:'image/png'}}],o=>{
      S.style.icons[d.id]={name:o.name.trim()||APPS.find(x=>x.id===d.id).name,emoji:o.emoji.trim()||APPS.find(x=>x.id===d.id).emoji,img:o.img};save();renderApp();
    },[{label:'恢复默认',fn:(_,close)=>{delete S.style.icons[d.id];save();close();renderApp()}}]);
  },
  /* 设置 */
  mprofile(){
    form('我的资料',[{k:'avatarImg',type:'img',label:'头像(上传图片)',val:isImg(S.me.avatar)?S.me.avatar:'',ph:'头像'},{k:'emoji',label:'或使用 emoji / 文字头像',val:isImg(S.me.avatar)?'':S.me.avatar},{k:'name',label:'昵称',val:S.me.name},{k:'persona',label:'我的人设(角色会据此和你互动)',type:'area',rows:4,val:S.me.persona,ph:'例如:大学生,养了一只橘猫,喜欢摄影'}],o=>{
      if(!o.name.trim()){toast('昵称不能为空');return false}
      S.me={name:o.name.trim(),avatar:o.avatarImg||o.emoji||'🙂',persona:o.persona};save();renderApp();
    });
  },
  msettings(){
    const st=S.settings;
    form('API 设置',[
      {k:'baseUrl',label:'接口地址(OpenAI 兼容,不含 /chat/completions)',val:st.baseUrl},{k:'apiKey',label:'API Key',type:'password',val:st.apiKey},
      {k:'model',label:'模型名称',val:st.model},{k:'temperature',label:'temperature(越高越发散)',type:'number',step:'0.1',val:st.temperature},
      {k:'history',label:'每次带入的历史消息条数',type:'number',val:st.history},
      {k:'stream',label:'流式输出(边生成边显示)',type:'check',val:st.stream},{k:'autoVoice',label:'自动朗读角色的语音消息',type:'check',val:st.autoVoice},
      {k:'proactive',label:'角色会主动发消息(会消耗额度)',type:'check',val:st.proactive},{k:'proactiveMin',label:'主动消息最短间隔(分钟)',type:'number',val:st.proactiveMin}
    ],o=>{S.settings=readSettings(o);save();renderApp();toast('已保存')},
    [{label:'测试连接',fn:async o=>{S.settings=readSettings(o);save();toast('测试中…');try{await callAPI([{role:'user',content:'回复 ok'}]);toast('连接成功 ✅')}catch(e){toast(e.message==='NOKEY'?'请先填写 API Key':errText(e).slice(0,90))}}}]);
  },
  mexport(){
    const c=JSON.parse(JSON.stringify(S));c.settings.apiKey='';
    sheet('<h3>导出数据</h3><p class="desc">会导出全部好友、聊天、动态、论坛、世界书、美化与图片(不含 API Key)。</p><div class="row" style="justify-content:center"><button class="btn" data-x="dl">下载备份文件</button></div>',s=>{
      s.querySelector('[data-x=dl]').onclick=()=>download('ai-phone-backup.json',JSON.stringify(c))
    });
  },
  mimport(){
    sheet('<h3>导入数据</h3><div class="row" style="justify-content:center"><button class="btn ghost" data-x="file">选择备份文件</button></div><textarea id="im" rows="5" placeholder="或粘贴备份 JSON" style="margin-top:12px"></textarea><div class="row"><button class="btn ghost" data-x="no">取消</button><button class="btn" data-x="ok">导入并覆盖</button></div>',(s,close)=>{
      const run=txt=>{try{const p=JSON.parse(txt),d=defaults();S={...d,...p,settings:{...d.settings,...p.settings,apiKey:S.settings.apiKey||p.settings?.apiKey||''},style:{...d.style,...p.style,icons:{...(p.style?.icons||{})}},wallet:{...d.wallet,...p.wallet},forum:{...d.forum,...p.forum},me:{...d.me,...p.me}};save();close();ui.app=null;ui.sub=null;renderApp();toast('导入成功')}catch(e){toast('JSON 格式不正确')}};
      s.querySelector('[data-x=no]').onclick=close;s.querySelector('[data-x=ok]').onclick=()=>run($('#im',s).value);
      s.querySelector('[data-x=file]').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>run(r.result);r.readAsText(f)};i.click()};
    });
  },
  async mreset(){if(!await askConfirm('清空所有数据(含好友、聊天、动态、论坛、世界书、图片、API 设置)?'))return;S=defaults();save();ui.app=null;ui.sub=null;renderApp();toast('已清空')}
};
const selMsg0=mid=>ui.sub?chatLog(ui.sub.id).find(x=>x.id===mid):null;
const readSettings=o=>({baseUrl:o.baseUrl.trim(),apiKey:o.apiKey.trim(),model:o.model.trim(),temperature:Number(o.temperature)||0.9,history:parseInt(o.history)||24,stream:!!o.stream,autoVoice:!!o.autoVoice,proactive:!!o.proactive,proactiveMin:Math.max(1,parseInt(o.proactiveMin)||5)});

const phone=$('#phone');
let lp=null,lpFired=false;
phone.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-mid]');if(!t)return;lpFired=false;lp=setTimeout(()=>{lpFired=true;msgMenu(t.dataset.mid)},480)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>phone.addEventListener(ev,()=>clearTimeout(lp)));
phone.addEventListener('scroll',()=>clearTimeout(lp),true);
phone.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-mid]');if(t){e.preventDefault();clearTimeout(lp);msgMenu(t.dataset.mid)}});
phone.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=acts[t.dataset.act];if(!f)return;
  if(t.closest('.sheet'))closeSheets();
  f(t.dataset,t,e);
});

/* ================= 桌面适配:按 iPhone 17 Pro Max(440×956)等比缩放 ================= */
function fit(){
  if(innerWidth>=560){const k=Math.min(1,(innerHeight-40)/956);phone.style.transform=k<1?`scale(${k})`:''}
  else phone.style.transform='';
}
addEventListener('resize',fit);fit();

/* ================= 定时任务 ================= */
S.orders.filter(o=>o.status==='delivering').forEach(o=>o.eta<=now()?(o.status='done'):schedule(o));
setInterval(tick,15000);
setInterval(async()=>{
  const st=S.settings;if(!st.proactive||!st.apiKey||document.hidden)return;
  if(now()-(S.lastPro||0)<st.proactiveMin*60000||Math.random()>.5)return;
  const cands=S.chars.filter(c=>!M(c.id).blocked&&!c.blockedMe&&!chatBusy[c.id]);if(!cands.length)return;
  const c=pick(cands);S.lastPro=now();
  chatLog(c.id).push({id:uid(),role:'sys',type:'sys',ai:true,hidden:true,content:'(你想主动给用户发一条消息:可以是分享此刻的见闻、想念、随口一问或逗对方。不要重复之前说过的话。)',time:now()});
  await aiReply(c.id);
},60000);

renderApp();
</script>
